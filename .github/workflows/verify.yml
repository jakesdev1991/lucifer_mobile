# Host-side verification, on every push and pull request.
#
# The repo had eight verify harnesses and three audit scripts and nothing that ran them. This runs all
# of them through `scripts/verify_all.sh`, which is the same command a person runs locally.
#
# The Kotlin half of each harness needs kotlinc and a JDK. It is not installed here by default, so those
# steps report SKIPPED rather than pretending to pass — `verify_all.sh` counts SKIPPED separately for
# exactly that reason. Enable the second job (set the repository variable RUN_KOTLIN_HARNESSES=true) once
# the harnesses are known to compile in CI; it then runs them in strict mode, where a missing toolchain
# is a failure instead of a skip.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host-checks:
    name: specs + static audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run every host-side check
        run: ./scripts/verify_all.sh --quiet

  kotlin-harnesses:
    name: kotlin harnesses (opt-in)
    if: vars.RUN_KOTLIN_HARNESSES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install kotlinc
        run: |
          curl -sSLo /tmp/kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kotlinc.zip -d /opt
          echo "/opt/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Run every host-side check, strict
        env:
          LUCIFER_REQUIRE_KOTLIN: "1"
        run: ./scripts/verify_all.sh --quiet
