# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dcompose.compiler.suppressKotlinVersionCompatibilityCheck=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Android
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# Compose
androidx.compose.compiler.version=1.5.3

# Versions
agpVersion=8.3.0
kotlinVersion=1.9.10
composeBomVersion=2024.04.00

# Suppress Kotlin version compatibility check for Compose Compiler
compose.compiler.suppressKotlinVersionCompatibilityCheck=true
kotlinxCoroutinesVersion=1.7.3
kotlinxSerializationVersion=1.5.1
ktorVersion=2.3.8
hiltVersion=2.51.1
roomVersion=2.6.1
lifecycleVersion=2.7.0
navigationVersion=2.7.6
datastoreVersion=1.1.1
securityCryptoVersion=1.1.0-alpha06
biometricVersion=1.2.0-alpha04
windowVersion=1.3.0
coreKtxVersion=1.12.0
activityComposeVersion=1.8.2
constraintlayoutVersion=2.1.4
materialVersion=1.6.1
material3Version=1.2.0
kotlinxDatetimeVersion=0.5.0

# Disable AAR metadata check
android.disableAarMetadata=true

# Enable AndroidX
android.useAndroidX=true
android.enableJetifier=true
